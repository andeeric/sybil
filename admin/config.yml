backend:
  name: git-gateway
  branch: main

site_url: https://sybiltest.netlify.app
display_url: https://sybiltest.netlify.app
logo_url: /logo.svg

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "site"
        label: "Main Site"
        file: "content/site.json"
        format: "json"
        fields:
          # Home / hero
          - {label: "Hero Background Image", name: "heroImage", widget: "image", required: false}
          - {label: "Logo", name: "logoImage", widget: "image", required: false}
          - {label: "Spotify Embed URL", name: "spotifyEmbed", widget: "string", hint: "Paste the Spotify embed URL from Spotify's Share > Embed menu."}

          # Coming Up
          - {label: "Coming Up", name: "comingUp", widget: "string"}
          - {label: "Coming Up Background Image", name: "comingUpImage", widget: "image", required: false}
          - {label: "Coming Up Link URL", name: "comingUpLink", widget: "string", required: false, hint: "Optional link for the Coming Up section."}
          - {label: "Coming Up Link Label", name: "comingUpLinkLabel", widget: "string", required: false, default: "Find out more"}
          - {label: "Coming Up YouTube Video URL", name: "comingUpVideo", widget: "string", required: false, hint: "Optional YouTube video URL."}

          # Live Sessions
          - {label: "Live Sessions Background Image", name: "liveSessionsImage", widget: "image", required: false}
          - label: "Live Sessions Videos"
            name: "liveSessions"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "YouTube URL", name: "youtubeUrl", widget: "string", hint: "Use a normal YouTube video URL, e.g. https://www.youtube.com/watch?v=..."}

          # About
          - {label: "About Background Image", name: "aboutImage", widget: "image", required: false}
          - {label: "About Text", name: "about", widget: "text"}

          # Shared footer / social links
          - label: "Social Links"
            name: "socials"
            widget: "object"
            fields:
              - {label: "Facebook", name: "facebook", widget: "string", required: false}
              - {label: "Instagram", name: "instagram", widget: "string", required: false}
              - {label: "YouTube", name: "youtube", widget: "string", required: false}
              - {label: "Spotify", name: "spotify", widget: "string", required: false}
              - {label: "TikTok", name: "tiktok", widget: "string", required: false}

  - name: "images"
    label: "Images"
    folder: "assets/images/library"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Alt Text", name: "alt", widget: "string", required: false}
      - {label: "Caption", name: "caption", widget: "string", required: false}
